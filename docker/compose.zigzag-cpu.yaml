# Applied by devnet_compose only to the dedicated ZigZag Curio process.
# Pool sizes are resolved by its launcher before the Go/FFI process starts.
services:
  curio:
    environment:
      RAYON_NUM_THREADS: ${RAYON_NUM_THREADS:-auto}
      EC_GPU_NUM_THREADS: ${EC_GPU_NUM_THREADS:-auto}
      FIL_PROOFS_ZIGZAG_SETUP_WORKERS: ${FIL_PROOFS_ZIGZAG_SETUP_WORKERS-auto}
      FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE: ${FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE:-1}
      FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_AFFINITY: ${FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_AFFINITY:-1}
      FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_PRODUCERS: ${FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_PRODUCERS:-2}
      FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_PRODUCER_STRIDE: ${FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_PRODUCER_STRIDE:-128}
      FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_LOOKAHEAD: ${FIL_PROOFS_ZIGZAG_MULTICORE_ENCODE_LOOKAHEAD:-4096}
      FIL_PROOFS_ZIGZAG_PARENT_BUFFER_NODES: ${FIL_PROOFS_ZIGZAG_PARENT_BUFFER_NODES:-0}
      FIL_PROOFS_ZIGZAG_PARENT_CACHE_DONTNEED: ${FIL_PROOFS_ZIGZAG_PARENT_CACHE_DONTNEED:-0}
      FIL_PROOFS_ZIGZAG_TREE_R_DONTNEED: ${FIL_PROOFS_ZIGZAG_TREE_R_DONTNEED:-0}
      FIL_PROOFS_ZIGZAG_TREE_R_BUILDER: ${FIL_PROOFS_ZIGZAG_TREE_R_BUILDER-legacy}
      FIL_PROOFS_ZIGZAG_ENCODE_PREHASH: ${FIL_PROOFS_ZIGZAG_ENCODE_PREHASH-0}
      FIL_PROOFS_ZIGZAG_LAYER_PIPELINE: ${FIL_PROOFS_ZIGZAG_LAYER_PIPELINE-sequential}
      FIL_PROOFS_ZIGZAG_TREE_R_THREADS: ${FIL_PROOFS_ZIGZAG_TREE_R_THREADS-auto}
      FIL_PROOFS_ZIGZAG_SNAPSHOT_BUFFER_MIB: ${FIL_PROOFS_ZIGZAG_SNAPSHOT_BUFFER_MIB-64}
      FIL_PROOFS_ZIGZAG_GROTH16_BATCH_SIZE:
      FIL_PROOFS_ZIGZAG_PARAMETER_LOADER: ${FIL_PROOFS_ZIGZAG_PARAMETER_LOADER:-compact}
      FIL_PROOFS_ZIGZAG_QUERY_CACHE_BYTES: ${FIL_PROOFS_ZIGZAG_QUERY_CACHE_BYTES:-0}
      FIL_PROOFS_ZIGZAG_QUERY_CACHE_RESERVE_BYTES: ${FIL_PROOFS_ZIGZAG_QUERY_CACHE_RESERVE_BYTES:-60129542144}
      RUST_LOG: ${RUST_LOG:-zigzag_cpu=info,zigzag_cache=info,zigzag_parameters=info,zigzag_merkle=info,zigzag_pipeline=info,zigzag_setup=info}
